		<style>
			.dark #loader {
				background-color: #181a1b !important;
			}

			.light #loader {
				background-color: white !important;
			}

			.dark #loader span {
				background-color: white !important;
			}

			.light #loader span {
				background-color: #181a1b !important;
			}

			#loader span {
				display: block;
				width: 0.5rem;
				margin: auto 0.25rem;
				animation: loading 1s infinite;
			}

			#loader.content-loaded {
				opacity: 0 !important;
				z-index: -1 !important;
				transition: 0.5s !important;
			}

			@keyframes loading {
				0%,
				30% {
					height: 2rem;
				}

				50% {
					height: 3rem;
				}

				70%,
				100% {
					height: 2rem;
				}
			}
		</style>
	</head>

	<body style="margin: 0">
		<noscript>You need to enable JavaScript to run this app.</noscript>
		<div id="loader" style="display: flex; position: fixed; width: 100vw; height: 100vh; justify-content: center; align-items: center; z-index: 20; background: white">
			<span style="animation-delay: 0.1s; background: #181a1b"></span>
			<span style="animation-delay: 0.2s; background: #181a1b"></span>
			<span style="animation-delay: 0.3s; background: #181a1b"></span>
			<span style="animation-delay: 0.4s; background: #181a1b"></span>
			<span style="animation-delay: 0.5s; background: #181a1b"></span>
			<span style="animation-delay: 0.6s; background: #181a1b"></span>
			<span style="animation-delay: 0.7s; background: #181a1b"></span>
			<span style="animation-delay: 0.8s; background: #181a1b"></span>
			<span style="animation-delay: 0.9s; background: #181a1b"></span>
		</div>
		<div id="root"></div>
		<script type="module">
			if (import.meta.env.PROD) {
				var k = document.getElementsByTagName("head")[0];
				var c = document.createElement("script");
				c.async = true;
				c.type = "text/javascript";
				c.charset = "utf-8";
				c.setAttribute("crossorigin", "anonymous");
				c.src = "https://akashraj.tech/js/a.js";
				k.appendChild(c);
			}
			window.onload = (e) => {
				let loader = document.getElementById("loader");
				// this prevents capturing the fully loaded state when using react-snapshot to generate static pages
				// this will run if host is no localhost or if env is not prodution
				if (location.hostname !== "localhost" || !import.meta.env.PROD) {
					loader.classList.add("content-loaded");
				}
			};
		</script>
		<script type="module" src="/src/index.jsx"></script>
	</body>
