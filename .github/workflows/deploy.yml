name: Deploy

on:
  push:
    branches:
      - master
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "yarn.lock"
      - "vite.config.mjs"
      - ".env"
      - ".yarnrc.yml"
      - "deploy.sh"
      - "id_rsa.enc"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "false"
      ENC_KEY: ${{ secrets.ENC_KEY }}
      USER: ${{ secrets.USER }}
      SERVER: ${{ secrets.SERVER }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Yarn via Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build and deploy
        run: bash ./deploy.sh
